<!-- Site header with responsive navigation (same on every page) -->

  <nav class="wrap nav" aria-label="Main navigation">
    <a class="logo" href="index.html">Terngu<span>Blessing</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">☰</button>
    <ul id="navList">
      <li><a class="link" href="index.html">Home</a></li>

<main>
<section class="page-title"><div class="wrap"><h1>Academic planner</h1><p class="lead">Add tasks, tick them off when done, and delete what you no longer need. Tasks are saved in your browser.</p></div></section>
<section class="section">
  <div class="wrap">
    <!-- Task form: handled by script.js -->
    <form id="taskForm" class="planner-form" novalidate>
      <div><label for="taskTitle">Task</label><input id="taskTitle" type="text" placeholder="e.g. Finish database assignment" required></div>
      <div><label for="taskCourse">Course</label><input id="taskCourse" type="text" placeholder="e.g. CSC 301"></div>
      <div><label for="taskDate">Due date</label><input id="taskDate" type="date"></div>
      <button class="btn" type="submit">Add task</button>
    </form>
    <span class="error-msg" id="taskError" role="alert"></span>
    <p class="counter" id="taskCounter"></p>
    <ul class="task-list" id="taskList" aria-live="polite"></ul>
  </div>
</section>
</main>
<footer class="site-footer">
